services:
  vibe-trading:
    build:
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:7897
        - HTTPS_PROXY=http://host.docker.internal:7897
        - NO_PROXY=localhost,127.0.0.1,host.docker.internal
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - agent/.env
    environment:
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - ~/.vibe-trading:/home/vibe/.vibe-trading
    command: ["python", "-m", "uvicorn", "extensions.live.serve_with_bridge:app", "--host", "0.0.0.0", "--port", "8899"]
    restart: unless-stopped

  live-trading:
    build: .
    user: root
    env_file:
      - agent/.env
    environment:
      - HTTP_PROXY=http://host.docker.internal:7897
      - HTTPS_PROXY=http://host.docker.internal:7897
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
      - HOME=/home/vibe
    volumes:
      - live-trading-data:/home/vibe/.vibe-trading
    command: ["python", "extensions/ext_cli/run_live_trading.py", "--live", "--confirm-live", "I_UNDERSTAND", "--exchange", "bitget", "--balance", "50", "--interval", "5", "--position-size", "0.12"]
    restart: unless-stopped
    healthcheck:
      disable: true

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  live-trading-data:
