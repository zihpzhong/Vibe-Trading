services:
  vibe-trading:
    build:
      context: .
      args:
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - NO_PROXY=*
    ports:
      - "127.0.0.1:8899:8899"
    env_file:
      - agent/.env
    environment:
      - VIBE_TRADING_TRUST_DOCKER_LOOPBACK=1
      # AGT 使用子账号 / AGT uses sub-account
      - BITGET_API_KEY=bg_5140969e913c521ac76e6906e3b938db
      - BITGET_SECRET=ad095e410bb474076d17d83d95f17164410827aa3dd246491d823a6442f03c96
      - BITGET_PASSPHRASE=fm7it5ui
    volumes:
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      - ~/.vibe-trading:/home/vibe/.vibe-trading
    command: ["python", "-m", "uvicorn", "extensions.live.serve_with_bridge:app", "--host", "0.0.0.0", "--port", "8899"]
    restart: unless-stopped

  live-trading:
    build: .
    user: root
    env_file:
      - agent/.env
    environment:
      - HOME=/home/vibe
      # AUT 使用主账号（原密钥）/ AUT uses main account (original keys)
      - BITGET_API_KEY=bg_0796e6fc9752e6bf85f797d8944ee0f4
      - BITGET_SECRET=36b9d09a74d195a0e790210853c8c67a1aca7e8f1cd22841e1bd0c27b948f569
      - BITGET_PASSPHRASE=fm7it5ui
    volumes:
      - live-trading-data:/home/vibe/.vibe-trading
    command: ["python", "extensions/ext_cli/run_live_trading.py", "--live", "--confirm-live", "I_UNDERSTAND", "--exchange", "bitget", "--balance", "50", "--interval", "5", "--position-size", "0.12"]
    restart: unless-stopped
    healthcheck:
      disable: true

  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5899:5899"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://vibe-trading:8899
    command: sh -c "npm install && npm run dev -- --host --port 5899"
    profiles:
      - frontend
    depends_on:
      vibe-trading:
        condition: service_started

volumes:
  vibe-runs:
  vibe-sessions:
  live-trading-data:
